app:
  database_url: sqlite:///data/tuntu.db
  timezone: Asia/Shanghai

schedules:
  - name: weekly-discovery
    cron: "0 20 * * *"
    profile: default

profiles:
  default:
    period: weekly
    discovery_sources:
      - plugin: tuntu_jav.providers:JavDbRanking
        enabled: true
      - plugin: tuntu_movies.providers:TmdbPopular
        enabled: false
        options:
          api_key: ${TMDB_API_KEY}
    candidate_sources:
      - plugin: tuntu_jav.providers:SukebeiRss
        enabled: true
      - plugin: tuntu_bittorrent.providers:Knaben
        enabled: true
    rules:
      - plugin: tuntu.rules:MinSeeders
        options: { value: 1 }
      - plugin: tuntu.rules:SizeRange
        options: { min_mb: 500, max_mb: 51200 }
    routes:
      - name: public-to-cloud
        match:
          transfer_kinds: [magnet]
          exclude_tags: [private]
        destination: /115open/tuntu
        downloader:
          plugin: tuntu_clouddrive2:CloudDrive2Client
          options:
            url: http://clouddrive2:19798
            username: ${CD2_USERNAME}
            password: ${CD2_PASSWORD}
      - name: private-to-local
        match:
          require_tags: [private]
        destination: /downloads/pt
        downloader:
          plugin: tuntu_qbittorrent:QBittorrentClient
          options:
            url: http://qbittorrent:8080
            username: ${QBITTORRENT_USERNAME}
            password: ${QBITTORRENT_PASSWORD}
